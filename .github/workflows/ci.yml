name: EchoTrace CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ make

    - name: Build library and CLI
      run: make cli
      working-directory: echotrace

    - name: Run self-test
      run: ./build/bin/echotrace --self-test
      working-directory: echotrace

    - name: Build and run unit tests
      run: make test
      working-directory: echotrace

    - name: Build and run benchmarks
      run: make bench
      working-directory: echotrace

  web-backend:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: echotrace/web/backend/package-lock.json

    - name: Install backend dependencies
      run: npm ci
      working-directory: echotrace/web/backend

    - name: Run backend tests
      run: npm test
      working-directory: echotrace/web/backend

  web-frontend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: echotrace/web/frontend/package-lock.json

    - name: Install frontend dependencies
      run: npm ci
      working-directory: echotrace/web/frontend

    - name: Build frontend
      run: npm run build
      working-directory: echotrace/web/frontend
